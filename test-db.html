<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>db.js Test</title>
</head>
<body>

<h1>db.js Test</h1>

<script src="db.js"></script>

<script>
    function test() {
        try {
            // Open the database.
            const ob = db.openCostsDB("costsdb", 1);

            // Add the first cost.
            const result1 = ob.addCost({
                sum: 200,
                currency: "USD",
                category: "FOOD",
                description: "pizza"
            });

            // Add the second cost.
            const result2 = ob.addCost({
                sum: 400,
                currency: "USD",
                category: "CAR",
                description: "fuel"
            });

            if (ob) {
                console.log("creating db succeeded");
            }

            if (result1) {
                console.log("adding 1st cost item succeeded");
            }

            if (result2) {
                console.log("adding 2nd cost item succeeded");
            }

            // Get the report for the current month.
            const data = db.getReport("USD");

            console.log("Report:");
            console.log(data);

            console.log("Total:");
            console.log(data.total.sum);

        } catch (exception) {
            console.log(exception.message);
        }
    }

    test();
</script>

</body>
</html>
