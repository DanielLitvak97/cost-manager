<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cost Manager - Reports</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="main-header">
    <div class="header-content">

        <h1>Cost Manager</h1>

        <nav>
            <a href="index.html">Costs</a>
            <a href="report.html" class="active">Reports</a>
            <a href="charts.html">Charts</a>
            <a href="settings.html">Settings</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="card">

        <h2>Monthly Report</h2>

        <form id="reportForm">

            <div class="form-group">
                <label for="reportYear">Year</label>

                <input
                        type="number"
                        id="reportYear"
                        name="reportYear"
                        min="1"
                        max="9999"
                        step="1"
                        required
                >
            </div>


            <div class="form-group">
                <label for="reportMonth">Month</label>

                <select id="reportMonth" name="reportMonth" required>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>


            <div class="form-group">
                <label for="reportCurrency">Currency</label>

                <select id="reportCurrency" name="reportCurrency" required>
                    <option value="USD">USD</option>
                    <option value="ILS">ILS</option>
                    <option value="GBP">GBP</option>
                    <option value="EURO">EURO</option>
                </select>
            </div>


            <button type="submit" class="primary-button">
                Get Report
            </button>

        </form>

        <p id="reportMessage" class="message"></p>

    </section>


    <section id="reportResult" class="card">

        <div class="section-header">
            <h2>Report</h2>

            <div id="reportPeriod"></div>
        </div>


        <div class="report-total">
            <span>Total:</span>

            <strong id="reportTotal">
                0
            </strong>
        </div>


        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>Day</th>
                    <th>Sum</th>
                    <th>Currency</th>
                    <th>Category</th>
                    <th>Description</th>
                </tr>
                </thead>

                <tbody id="reportTableBody">
                </tbody>

            </table>

        </div>


        <p id="noReportCosts" class="empty-message">
            No costs were found for this month.
        </p>

    </section>

</main>


<script
        src="db.js"
        data-skip-default-rates="true"
></script>
<script src="js/currency.js"></script>
<script src="js/report.js"></script>

</body>
</html>
