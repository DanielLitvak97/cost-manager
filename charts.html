<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cost Manager - Charts</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Chart.js is used to display the pie and bar charts. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="main-header">

    <h1>Cost Manager</h1>

    <nav>
        <a href="index.html">Costs</a>
        <a href="report.html">Reports</a>
        <a href="charts.html" class="active">Charts</a>
        <a href="settings.html">Settings</a>
    </nav>

</header>

<main class="page-container">

    <!-- Pie chart section. -->
    <section class="page-section">

        <h2>Monthly Costs by Category</h2>

        <form id="pieChartForm">

            <div class="form-group">

                <label for="pieYear">
                    Year
                </label>

                <input
                        type="number"
                        id="pieYear"
                        name="pieYear"
                        min="1"
                        max="9999"
                        step="1"
                        required
                >

            </div>

            <div class="form-group">

                <label for="pieMonth">
                    Month
                </label>

                <select id="pieMonth" required>

                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>

                </select>

            </div>

            <div class="form-group">

                <label for="pieCurrency">
                    Currency
                </label>

                <select id="pieCurrency" required>

                    <option value="USD">USD</option>
                    <option value="ILS">ILS</option>
                    <option value="GBP">GBP</option>
                    <option value="EURO">EURO</option>

                </select>

            </div>

            <button type="submit">
                Get Pie Chart
            </button>

        </form>

        <div
                id="pieChartMessage"
                class="message"
                aria-live="polite"
        ></div>

        <div class="chart-container">

            <canvas id="pieChart"></canvas>

        </div>

    </section>


    <!-- Bar chart section. -->
    <section class="page-section">

        <h2>Yearly Costs by Month</h2>

        <form id="barChartForm">

            <div class="form-group">

                <label for="barYear">
                    Year
                </label>

                <input
                        type="number"
                        id="barYear"
                        name="barYear"
                        min="1"
                        max="9999"
                        step="1"
                        required
                >

            </div>

            <div class="form-group">

                <label for="barCurrency">
                    Currency
                </label>

                <select id="barCurrency" required>

                    <option value="USD">USD</option>
                    <option value="ILS">ILS</option>
                    <option value="GBP">GBP</option>
                    <option value="EURO">EURO</option>

                </select>

            </div>

            <button type="submit">
                Get Bar Chart
            </button>

        </form>

        <div
                id="barChartMessage"
                class="message"
                aria-live="polite"
        ></div>

        <div class="chart-container">

            <canvas id="barChart"></canvas>

        </div>

    </section>

</main>

<script src="db.js"></script>
<script src="js/currency.js"></script>
<script src="js/charts.js"></script>

</body>
</html>
