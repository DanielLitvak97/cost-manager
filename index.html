<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cost Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="main-header">
    <div class="header-content">
        <h1>Cost Manager</h1>

        <nav>
            <a href="index.html" class="active">Costs</a>
            <a href="report.html">Reports</a>
            <a href="charts.html">Charts</a>
            <a href="settings.html">Settings</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="card">
        <h2>Add Cost</h2>

        <form id="costForm">

            <div class="form-group">
                <label for="sum">Sum</label>
                <input
                        type="number"
                        id="sum"
                        name="sum"
                        min="0.01"
                        step="0.01"
                        required
                >
            </div>

            <div class="form-group">
                <label for="currency">Currency</label>

                <select id="currency" name="currency" required>
                    <option value="USD">USD</option>
                    <option value="ILS">ILS</option>
                    <option value="GBP">GBP</option>
                    <option value="EURO">EURO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>

                <input
                        type="text"
                        id="category"
                        name="category"
                        required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <input
                        type="text"
                        id="description"
                        name="description"
                        required
                >
            </div>

            <button type="submit" class="primary-button">
                Add Cost
            </button>

        </form>

        <p id="message" class="message"></p>
    </section>


    <section class="card">
        <div class="section-header">
            <h2>Saved Costs</h2>

            <button id="refreshButton" class="secondary-button">
                Refresh
            </button>
        </div>

        <div class="table-container">

            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Sum</th>
                    <th>Currency</th>
                    <th>Category</th>
                    <th>Description</th>
                </tr>
                </thead>

                <tbody id="costsTableBody">
                </tbody>
            </table>

        </div>

        <p id="noCostsMessage" class="empty-message">
            No costs have been added yet.
        </p>
    </section>

</main>

<script
        src="db.js"
        data-skip-default-rates="true"
></script>
<script src="js/app.js"></script>

</body>
</html>
